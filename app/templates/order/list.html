{% extends "base.html" %}

{% block title %}Замовлення{% endblock %}

{% block head %}
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/css/bootstrap-datepicker.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <link
            href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/order/list.css') }}">
{% endblock %}

{% block content %}
    <div class="row align-items-center">
        <div class="col">
            <h1 class="mb-0">Замовлення</h1>
        </div>
        <div class="col-auto">
            <a href="{{ url_for('order.add_order') }}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Додати нове
            </a>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <form method="get" action="{{ url_for('order.orders_list') }}" class="row g-2 align-items-end mb-3">
                <div class="col-md-2">
                    <label class="form-label">Order ID</label>
                    <input name="order_id" class="form-control" value="{{ filters.order_id }}" placeholder="e.g. 123">
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="unitNamesSelect">Товар (вибір кількох)</label>
                    <select id="unitNamesSelect" name="unit_names" class="form-select product-select searchable-select"
                            multiple
                            data-initial='{{ (filters.unit_names or []) | tojson }}'>
                        {% for name in (filters.unit_names or []) %}
                            <option value="{{ name }}" selected>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label" for="start-date">Start date</label>
                    <input id="start-date" type="text" name="start" class="form-control datepicker"
                           value="{{ filters.start }}">
                </div>

                <div class="col-md-2">
                    <label class="form-label" for="end-date">End date</label>
                    <input id="end-date" type="text" name="end" class="form-control datepicker"
                           value="{{ filters.end }}">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Per page</label>
                    <select name="per_page" class="form-select">
                        {% for n in [10,20,50,100] %}
                            <option value="{{ n }}" {% if filters.per_page==n %}selected{% endif %}>{{ n }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Apply</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('order.orders_list') }}">Reset</a>
                </div>
            </form>
            <div class="text-muted">Total orders: {{ pagination.total }}</div>
            <div id="ordersContainer">
                {% include "order/_orders_table.html" %}
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script
            src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.10.0/js/bootstrap-datepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="{{ url_for('static', filename='js/order/order_list.js') }}"></script>
{% endblock %}
